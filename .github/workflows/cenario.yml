# Bússola Financeira: gera o cenario.json nos dias úteis e publica no próprio repositório (GitHub Pages).
# Horários em UTC; Brasília é UTC-3 o ano todo.
name: Cenário diário
on:
  schedule:
    - cron: '27 10 * * 1-5'   # 07:27 em Brasília
    - cron: '57 15 * * 1-5'   # 12:57
    - cron: '27 21 * * 1-5'   # 18:27
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: cenario
  cancel-in-progress: false
jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Testar o gerador (respostas simuladas)
        run: node testar-gerador.mjs
      - name: Gerar cenario.json (fontes reais)
        run: node gerar-cenario.mjs
      - name: Publicar se mudou
        run: |
          if git diff --quiet -- cenario.json && git ls-files --error-unmatch cenario.json >/dev/null 2>&1; then
            echo "Sem mudanças no cenario.json."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cenario.json
          git commit -m "Cenário atualizado $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
